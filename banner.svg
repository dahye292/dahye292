<svg xmlns="http://www.w3.org/2000/svg" width="854" height="200" viewBox="0 0 854 200">
  <style>
    .text { font-size: 72px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; animation: fadeIn 1.2s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9b9bf"/>
      <stop offset="100%" stop-color="#f2c9a6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7d5656" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="50%" cy="50%" r="62" fill="url(#g)" opacity="0.85" filter="url(#blur)">
    <animate attributeName="cx" values="50%;46%;50%;54%;50%" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="cy" values="50%;47%;50%;53%;50%" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cx="42%" cy="50%" r="66" fill="#e9b9bf" opacity="0.85" filter="url(#blur)">
    <animate attributeName="cx" values="42%;50%;58%;50%;42%" dur="16s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="cy" values="50%;53%;50%;47%;50%" dur="18s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cx="60%" cy="50%" r="64" fill="#f2c9a6" opacity="0.85" filter="url(#blur)">
    <animate attributeName="cx" values="60%;50%;40%;50%;60%" dur="14s" begin="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="cy" values="50%;48%;50%;52%;50%" dur="15s" begin="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cx="50%" cy="50%" r="50" fill="#edc0b2" opacity="0.6" filter="url(#blur)">
    <animate attributeName="r" values="50;58;50" dur="9s" repeatCount="indefinite"/>
  </circle>

  <text class="text" x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" filter="url(#shadow)">Dahye</text>
</svg>
